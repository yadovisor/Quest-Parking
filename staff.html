<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>駐車場フロント操作</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1C1F23;--line:#D8DCE0;--field:#F5F6F7;--sign:#0B5FA5;--full:#B3261E;--muted:#6E767E;
    --num:'Barlow Semi Condensed',system-ui,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Noto Sans JP',system-ui,sans-serif;color:var(--ink);background:#fff;
    line-height:1.6;padding:16px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:640px;margin:0 auto}
  .bar{background:#FBF7EC;border:1px solid #E8DFC5;border-radius:2px;padding:8px 12px;
    font-size:12px;color:#8A5A00;margin-bottom:16px}
  h1{font-size:16px;font-weight:700;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:16px}
  h1 span{font-size:12px;color:var(--muted);font-weight:400;margin-left:8px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
  .fld{flex:1;min-width:180px}
  label{display:block;font-size:12px;font-weight:500;margin-bottom:4px}
  input,textarea{width:100%;border:1px solid var(--line);border-radius:2px;padding:10px 12px;
    font-family:inherit;font-size:16px;color:var(--ink);background:#fff}
  input:focus,textarea:focus{outline:none;border-color:var(--sign);box-shadow:0 0 0 3px rgba(11,95,165,.15)}
  textarea{min-height:52px;resize:vertical}
  .btn{border:1px solid var(--sign);background:var(--sign);color:#fff;border-radius:2px;padding:10px 16px;
    font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap}
  .btn.sub{background:#fff;color:var(--sign)}
  .btn:disabled{opacity:.5;cursor:default}

  /* タブ */
  .tabs{display:flex;border-bottom:2px solid var(--ink);margin-bottom:16px}
  .tabs button{flex:1;border:none;background:#fff;padding:10px 4px;font-family:inherit;font-size:14px;
    font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
  .tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--sign)}

  /* 予約カード */
  .card{border:1px solid var(--line);border-radius:2px;padding:12px 14px;margin-bottom:10px}
  .card.off{background:var(--field);color:var(--muted)}
  .card .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
  .card .id{font-family:var(--num);font-size:15px;font-weight:700}
  .card .nm{font-size:16px;font-weight:700;margin-top:2px}
  .card .meta{font-size:13px;margin-top:4px}
  .card .sub{font-size:12px;color:var(--muted);margin-top:4px;word-break:break-all}
  .st{font-size:12px;font-weight:700;padding:2px 8px;border-radius:2px;border:1px solid var(--line)}
  .st.ok{color:var(--sign);border-color:#C5DAEA;background:#F1F6FA}
  .st.cx{color:var(--full);border-color:#F0C9C6;background:#FDF3F2}
  .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .acts button{flex:1;min-width:130px;border-radius:2px;padding:10px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer}
  .acts .cx{border:1px solid var(--full);background:#fff;color:var(--full)}
  .acts .ns{border:1px solid var(--muted);background:#fff;color:var(--muted)}
  .acts .gs{border:1px solid var(--sign);background:#fff;color:var(--sign)}
  .card .guest{font-size:13px;margin-top:4px;padding:4px 8px;background:#F1F6FA;border-left:3px solid var(--sign)}
  .count{font-size:12px;color:var(--muted);margin:4px 0 10px}
  .foot{font-size:12px;margin-top:24px;text-align:right}
  .foot a{color:var(--muted)}

  /* 電話予約の入力（従来の画面） */
  .counts{display:flex;gap:6px;flex-wrap:wrap}
  .counts button{flex:1;min-width:44px;border:1px solid var(--line);background:#fff;padding:10px 0;
    font-family:var(--num);font-size:18px;font-weight:700;border-radius:2px;cursor:pointer;color:var(--ink)}
  .counts button[aria-pressed="true"]{background:var(--sign);border-color:var(--sign);color:#fff}
  .nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .nav b{font-family:var(--num);font-size:17px}
  .nav button{border:1px solid var(--line);background:#fff;width:34px;height:34px;border-radius:2px;cursor:pointer}
  .nav button:disabled{opacity:.3}
  .dow{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;font-size:10px;color:var(--muted);text-align:center}
  .dow span:first-child{color:var(--full)}.dow span:last-child{color:var(--sign)}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:2px}
  .cell{aspect-ratio:1/1.05;border:1px solid var(--line);border-radius:2px;background:#fff;display:flex;
    flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-family:inherit;color:var(--ink)}
  .cell .d{font-family:var(--num);font-size:12px;color:var(--muted);line-height:1}
  .cell .n{font-family:var(--num);font-size:18px;font-weight:700;line-height:1.1}
  .cell.empty{border:none;cursor:default}
  .cell.off{background:var(--field);color:#B8BEC4;cursor:default}
  .cell.off .d,.cell.off .n{color:#B8BEC4}
  .cell.full{cursor:default;color:var(--full);border-color:#F0C9C6;
    background:repeating-linear-gradient(-45deg,#FDF3F2 0 6px,#FBE8E6 6px 12px)}
  .cell.full .n{font-size:12px}
  .cell.sel{background:var(--sign);border-color:var(--sign);color:#fff}
  .cell.sel .d,.cell.sel .n{color:#fff}
  .loading{text-align:center;color:var(--muted);font-size:12px;padding:32px 0}
  .sum{border:1px solid var(--line);background:var(--field);border-radius:2px;padding:10px 14px;
    margin:14px 0;font-size:13px;min-height:44px;display:flex;align-items:center;justify-content:space-between}
  .sum b{font-family:var(--num);font-size:20px}
  .go{width:100%;background:var(--sign);color:#fff;border:none;border-radius:2px;padding:15px;
    font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
  .go:disabled{background:#9AA3AB}
  .msg{padding:12px 14px;font-size:13px;border-radius:2px;margin-top:12px}
  .msg.err{background:#FDF3F2;border:1px solid #F0C9C6;color:var(--full)}
  .msg.ok{background:#F1F6FA;border:1px solid #C5DAEA;color:var(--sign)}
  .msg.ok .num{font-family:var(--num);font-weight:700;font-size:15px}

  .ov{position:fixed;inset:0;background:rgba(255,255,255,.88);display:none;
    align-items:center;justify-content:center;flex-direction:column;z-index:9999}
  .ov.on{display:flex}
  .ov .sp{width:44px;height:44px;border:4px solid var(--line);border-top-color:var(--sign);
    border-radius:50%;animation:spin .8s linear infinite}
  .ov p{margin-top:16px;font-size:14px;font-weight:700;color:var(--ink)}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="ov" id="ov"><div class="sp"></div><p id="ov-text">処理しています</p></div>
<div class="wrap">
  <div class="bar">フロント専用の画面です。お客様には共有しないでください。</div>
  <h1><span id="cfg-facility"></span> 駐車場<span>フロント操作</span></h1>

  <!-- 合言葉 -->
  <section id="gate" hidden>
    <div class="row">
      <div class="fld"><label for="pin">合言葉</label><input id="pin" type="password" autocomplete="current-password"></div>
      <button class="btn" id="pin-go">開く</button>
    </div>
    <div id="gate-msg"></div>
  </section>

  <section id="main" hidden>
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="find" aria-selected="true">予約を探す・キャンセル</button>
      <button role="tab" data-tab="new" aria-selected="false">電話予約を入力</button>
    </div>

    <!-- 予約を探す・キャンセル -->
    <div id="tab-find">
      <div class="row">
        <div class="fld"><label for="f-date">利用日で探す（前日照合は翌日の日付で）</label><input type="date" id="f-date"></div>
        <button class="btn" id="f-date-go">この日の予約</button>
      </div>
      <div class="row">
        <div class="fld"><label for="f-q">予約番号・お名前で探す</label><input id="f-q" placeholder="例：QP-20261114-003 ／ ヤマダ"></div>
        <button class="btn sub" id="f-q-go">探す</button>
      </div>
      <div id="f-msg"></div>
      <div id="f-list"></div>
    </div>

    <!-- 電話予約を入力 -->
    <div id="tab-new" hidden>
      <div class="row">
        <div class="fld" style="flex:2">
          <label for="name">お名前（代表者名・カナ推奨）</label>
          <input id="name" autocomplete="off" placeholder="例：ヤマダ タロウ">
        </div>
      </div>
      <div class="fld" style="margin-bottom:16px">
        <label>台数（大型車は占有する区画数）</label>
        <div class="counts" id="counts" role="group" aria-label="台数"></div>
      </div>
      <div class="fld" style="margin-bottom:8px">
        <label>利用日（連続しない日も選択可。チェックアウト日は含めない）</label>
        <div class="nav">
          <button id="prev" aria-label="前の月">◀</button>
          <b id="ym"></b>
          <button id="next" aria-label="次の月">▶</button>
        </div>
        <div class="dow"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div>
        <div class="grid" id="grid"><div class="loading">読み込み中</div></div>
      </div>
      <div class="sum" id="sum"><span style="color:#6E767E">日付未選択</span></div>
      <div class="fld" style="margin-bottom:16px">
        <label for="note">受付メモ（任意・車種やナンバー、電話番号など）</label>
        <textarea id="note" placeholder="例：白プリウス 品川300 / 当日18時着予定 / TEL 090-xxxx"></textarea>
      </div>
      <button class="go" id="go">この内容で登録する</button>
      <div id="msg"></div>
    </div>

    <p class="foot"><a href="#" id="logout">合言葉を入れ直す</a></p>
  </section>
</div>

<script>
  // ===== GAS APIの呼び出し口（施設ごとに違う。取り違え厳禁）=====
  const API_URL = 'https://script.google.com/macros/s/AKfycbwu2E3Q9009WS3-OREz_Ck3nvA7wAxXL5wDFYIzmls0XlI2Sg0cQIjmIkO6TK3JtbUI/exec';
  function api(action, data){
    return fetch(API_URL, { method:'POST', body: JSON.stringify(Object.assign({ action: action }, data || {})) })
      .then(function(r){ return r.json(); });
  }
  // 合言葉はこの端末に保存する（施設ごとに分ける）
  const PIN_KEY = 'parkingStaffPin:' + (location.pathname.split('/')[1] || 'local');
  let PIN = '';
  try { PIN = localStorage.getItem(PIN_KEY) || ''; } catch(e){}
  function savePin(p){ PIN = p; try { localStorage.setItem(PIN_KEY, p); } catch(e){} }
  function forgetPin(){ PIN = ''; try { localStorage.removeItem(PIN_KEY); } catch(e){} }
  function sapi(action, data){
    return api(action, Object.assign({ pin: PIN }, data || {})).then(function(r){
      if (r && r.auth === false){ forgetPin(); showGate('合言葉が違うか、変更されました。入れ直してください。'); throw { handled:true }; }
      return r;
    });
  }

  let CFG = null;
  const pad = n => ('0'+n).slice(-2);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const W = '日月火水木金土';
  const md = s => { if(!s) return ''; const p=s.split('-'); const d=new Date(+p[0],+p[1]-1,+p[2]); return (+p[1])+'/'+(+p[2])+'('+W[d.getDay()]+')'; };
  function overlay(on, text){ document.getElementById('ov-text').textContent = text || '処理しています'; document.getElementById('ov').classList.toggle('on', !!on); }

  // ---- 合言葉の画面 ----
  function showGate(msg){
    document.getElementById('main').hidden = true;
    document.getElementById('gate').hidden = false;
    document.getElementById('gate-msg').innerHTML = msg ? '<div class="msg err">'+esc(msg)+'</div>' : '';
    document.getElementById('pin').focus();
  }
  document.getElementById('pin-go').onclick = tryPin;
  document.getElementById('pin').addEventListener('keydown', e => { if (e.key === 'Enter') tryPin(); });
  function tryPin(){
    const p = document.getElementById('pin').value.trim();
    if (!p) return;
    savePin(p);
    overlay(true, '確認しています');
    sapi('staffCheck').then(r => { overlay(false); if (r && r.ok) openMain(); else showGate((r && r.message) || '確認できませんでした。'); })
      .catch(e => { overlay(false); if (!e || !e.handled) showGate('通信できませんでした。もう一度お試しください。'); });
  }
  document.getElementById('logout').onclick = e => { e.preventDefault(); forgetPin(); document.getElementById('pin').value=''; showGate(''); };

  // ---- タブ ----
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => selectTab(b.dataset.tab));
  let newReady = false;
  function selectTab(t){
    document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === t ? 'true' : 'false'));
    document.getElementById('tab-find').hidden = (t !== 'find');
    document.getElementById('tab-new').hidden = (t !== 'new');
    if (t === 'new' && !newReady){ newReady = true; initNew(); }
  }

  function openMain(){
    document.getElementById('gate').hidden = true;
    document.getElementById('main').hidden = false;
    const t = new Date(); t.setDate(t.getDate() + 1); // 既定は翌日（前日照合用）
    document.getElementById('f-date').value = t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate());
    const qid = new URLSearchParams(location.search).get('id');
    selectTab('find');
    if (qid){ document.getElementById('f-q').value = qid; search({ q: qid }); }
  }

  // ---- 予約を探す・キャンセル ----
  let lastQuery = null;
  document.getElementById('f-date-go').onclick = () => { const d = document.getElementById('f-date').value; if (d) search({ date: d }); };
  document.getElementById('f-q-go').onclick = () => { const q = document.getElementById('f-q').value.trim(); if (q) search({ q: q }); };
  document.getElementById('f-q').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('f-q-go').click(); });

  function fmsg(kind, html){ document.getElementById('f-msg').innerHTML = html ? '<div class="msg '+kind+'">'+html+'</div>' : ''; }

  function search(query){
    lastQuery = query;
    fmsg('', '');
    document.getElementById('f-list').innerHTML = '<div class="loading">探しています</div>';
    sapi('staffSearch', query).then(r => {
      if (!r || !r.ok){ document.getElementById('f-list').innerHTML=''; fmsg('err', esc((r && r.message) || 'エラーが発生しました。')); return; }
      renderList(r.items || [], query, r.more);
    }).catch(e => { if (!e || !e.handled){ document.getElementById('f-list').innerHTML=''; fmsg('err','通信できませんでした。もう一度お試しください。'); } });
  }

  function renderList(items, query, more){
    const box = document.getElementById('f-list');
    const head = query.date ? md(query.date)+' に利用がある予約' : '「'+esc(query.q)+'」の検索結果';
    const active = items.filter(i => i.status === '予約済').length;
    let html = '<p class="count">'+head+'：'+items.length+' 件（うち予約済 '+active+' 件）'+(more ? '　※100件まで表示' : '')+'</p>';
    if (!items.length) html += '<div class="loading">該当する予約はありません</div>';
    items.forEach(i => {
      const on = i.status === '予約済';
      const range = i.first === i.last ? md(i.first) : md(i.first)+'〜'+md(i.last);
      html += '<div class="card'+(on?'':' off')+'">'
        + '<div class="top"><span class="id">'+esc(i.id)+'</span><span class="st '+(on?'ok':'cx')+'">'+esc(i.status)+'</span></div>'
        + '<div class="nm">'+esc(i.name || '（お名前なし）')+' 様</div>'
        + (i.guest ? '<div class="guest">宿泊者名（照合用）：'+esc(i.guest)+'</div>' : '')
        + '<div class="meta">'+range+'（'+i.nights+'泊）／ '+i.count+'台'+(i.route ? ' ／ '+esc(i.route) : '')+'</div>'
        + ((i.tel || i.note) ? '<div class="sub">'+(i.tel ? 'TEL '+esc(i.tel) : '')+(i.tel && i.note ? '　' : '')+(i.note ? esc(i.note) : '')+'</div>' : '')
        + (on ? '<div class="acts"><button class="gs" data-id="'+esc(i.id)+'" data-guest="1">宿泊者名を入力</button>'
               + '<button class="cx" data-id="'+esc(i.id)+'" data-st="キャンセル">キャンセル</button>'
               + '<button class="ns" data-id="'+esc(i.id)+'" data-st="無断キャンセル">無断キャンセル</button></div>' : '')
        + '</div>';
    });
    box.innerHTML = html;
    box.querySelectorAll('.acts button').forEach(b => b.onclick = () => {
      const it = items.find(x => x.id === b.dataset.id);
      if (b.dataset.guest) setGuest(it); else setStatus(it, b.dataset.st);
    });
  }

  // 宿泊者名（照合用）：予約者と宿泊予約の名前が違うときに書き足す。予約者名は変わらない
  function setGuest(it){
    const v = prompt(it.id+'　'+(it.name || '')+' 様\n\n宿泊予約でのお名前を入力してください。\n予約者名はそのまま残ります。空にすると消えます。', it.guest || '');
    if (v === null) return;
    overlay(true, '登録しています');
    sapi('staffSetGuest', { id: it.id, guest: v.trim() }).then(r => {
      overlay(false);
      if (r && r.ok){
        fmsg('ok', '<span class="num">'+esc(r.id)+'</span> の宿泊者名を'+(r.guest ? '「'+esc(r.guest)+'」にしました。' : '消しました。'));
        if (lastQuery) { const keep = document.getElementById('f-msg').innerHTML; search(lastQuery); setTimeout(()=>{ document.getElementById('f-msg').innerHTML = keep; }, 0); }
      } else { fmsg('err', esc((r && r.message) || '登録できませんでした。')); }
    }).catch(e => { overlay(false); if (!e || !e.handled) fmsg('err','通信できませんでした。もう一度お試しください。'); });
  }

  function setStatus(it, st){
    const range = it.first === it.last ? md(it.first) : md(it.first)+'〜'+md(it.last);
    const what = st === 'キャンセル'
      ? 'お客様にキャンセル完了メールが届きます（メールアドレスがある予約のみ）。'
      : '無断キャンセルはお客様にメールを送りません（宿泊予約が見つからなかったときに使います）。';
    if (!confirm(it.id+'\n'+(it.name || '')+' 様\n'+range+' ／ '+it.count+'台\n\nこの予約を「'+st+'」にします。\n'+what+'\n\nよろしいですか？')) return;
    overlay(true, st+'にしています');
    sapi('staffSetStatus', { id: it.id, status: st }).then(r => {
      overlay(false);
      if (r && r.ok){
        fmsg('ok', '<span class="num">'+esc(r.id)+'</span> を「'+esc(r.status)+'」にしました。'+(r.status === 'キャンセル' ? (r.mailed ? 'キャンセル完了メールを送りました。' : '（メールアドレスがないため、メールは送っていません）') : ''));
        if (lastQuery) { const keep = document.getElementById('f-msg').innerHTML; search(lastQuery); setTimeout(()=>{ document.getElementById('f-msg').innerHTML = keep; }, 0); }
      } else { fmsg('err', esc((r && r.message) || '変更できませんでした。')); }
    }).catch(e => { overlay(false); if (!e || !e.handled) fmsg('err','通信できませんでした。予約の状態を検索し直して確認してください。'); });
  }

  // ---- 電話予約を入力（従来の画面）----
  const st = { count:1, sel:new Set(), avail:{}, cur:null, busy:false };
  const key = (y,m,d) => y+'-'+pad(m+1)+'-'+pad(d);
  const jp = s => { const p=s.split('-'); return +p[1]+'/'+(+p[2]); };
  let counts, minYM, maxYM;
  function initNew(){
    counts = document.getElementById('counts');
    for(let i=1;i<=CFG.maxCount;i++){
      const b=document.createElement('button');
      b.textContent=i; b.setAttribute('aria-pressed', i===1?'true':'false');
      b.onclick=()=>{ st.count=i; st.sel.clear();
        [...counts.children].forEach(c=>c.setAttribute('aria-pressed', c===b?'true':'false')); render(); };
      counts.appendChild(b);
    }
    minYM=CFG.minDate.slice(0,7); maxYM=CFG.maxDate.slice(0,7);
    st.cur=minYM;
    document.getElementById('prev').onclick=()=>move(-1);
    document.getElementById('next').onclick=()=>move(1);
    document.getElementById('go').onclick=submit;
    load();
  }
  function move(step){ const [y,m]=st.cur.split('-').map(Number);
    const d=new Date(y,m-1+step,1); const ym=d.getFullYear()+'-'+pad(d.getMonth()+1);
    if(ym<minYM||ym>maxYM) return; st.cur=ym; load(); }
  function load(){
    document.getElementById('grid').innerHTML='<div class="loading">読み込み中</div>';
    api('availability', { ym: st.cur })
      .then(r=>{ if(!r || !r.ok) throw 0; st.avail=Object.assign(st.avail, r.availability); render(); })
      .catch(()=>{ document.getElementById('grid').innerHTML='<div class="loading">読み込み失敗。再読み込みしてください。</div>'; });
  }
  function render(){
    const [y,m]=st.cur.split('-').map(Number);
    document.getElementById('ym').textContent=y+'年'+m+'月';
    document.getElementById('prev').disabled=(st.cur<=minYM);
    document.getElementById('next').disabled=(st.cur>=maxYM);
    const first=new Date(y,m-1,1), days=new Date(y,m,0).getDate();
    const g=document.getElementById('grid'); g.innerHTML='';
    for(let i=0;i<first.getDay();i++){ const e=document.createElement('div'); e.className='cell empty'; g.appendChild(e); }
    for(let d=1;d<=days;d++){
      const k=key(y,m-1,d), rem=st.avail[k];
      const b=document.createElement('button'); b.className='cell';
      if(rem===undefined){ b.className+=' off'; b.disabled=true; b.innerHTML='<span class="d">'+d+'</span><span class="n">–</span>'; }
      else if(rem<st.count){ b.className+=' full'; b.disabled=true; b.innerHTML='<span class="d">'+d+'</span><span class="n">満</span>'; }
      else { if(st.sel.has(k)) b.className+=' sel';
        b.innerHTML='<span class="d">'+d+'</span><span class="n">'+rem+'</span>';
        b.onclick=()=>{ st.sel.has(k)?st.sel.delete(k):st.sel.add(k); render(); }; }
      g.appendChild(b);
    }
    const list=[...st.sel].sort();
    document.getElementById('sum').innerHTML = list.length
      ? '<span>'+list.map(jp).join('・')+'　'+st.count+'台</span><b>'+(list.length*st.count*CFG.price).toLocaleString()+' 円</b>'
      : '<span style="color:#6E767E">日付未選択</span>';
  }
  function show(kind,html){ document.getElementById('msg').innerHTML='<div class="msg '+kind+'">'+html+'</div>'; }
  function submit(){
    if(st.busy) return;
    const name=document.getElementById('name').value.trim();
    const dates=[...st.sel].sort();
    if(!name){ show('err','お名前を入力してください。'); return; }
    if(!dates.length){ show('err','利用日を選んでください。'); return; }
    st.busy=true; const go=document.getElementById('go'); go.disabled=true; go.textContent='登録中';
    overlay(true, '登録しています');
    document.getElementById('msg').innerHTML='';
    sapi('staffCreate', { payload: { name:name, count:st.count, dates:dates, note:document.getElementById('note').value.trim() } })
      .then(r=>{
        st.busy=false; go.disabled=false; go.textContent='この内容で登録する'; overlay(false);
        if(r && r.ok){
          show('ok','<span class="num">'+r.id+'</span> で登録しました。'+r.datesJp.join('・')+' / '+r.count+'台 / '+r.total.toLocaleString()+'円（現地払い）');
          st.sel.clear(); document.getElementById('name').value=''; document.getElementById('note').value='';
          st.count=1; [...counts.children].forEach((c,i)=>c.setAttribute('aria-pressed', i===0?'true':'false'));
          load();
        } else { show('err', esc((r && r.message) || 'エラーが発生しました。')); }
      })
      .catch(e=>{ st.busy=false; go.disabled=false; go.textContent='この内容で登録する'; overlay(false);
        if (!e || !e.handled) show('err','登録できませんでした。もう一度お試しください。'); });
  }

  // ---- 起動 ----
  api('config').then(function(c){
    if(!c || !c.ok) throw 0;
    CFG = c;
    document.getElementById('cfg-facility').textContent = CFG.facility;
    document.title = CFG.facility + ' 駐車場フロント操作';
    if (!PIN){ showGate(''); return; }
    overlay(true, '確認しています');
    sapi('staffCheck').then(r => { overlay(false); if (r && r.ok) openMain(); else showGate((r && r.message) || ''); })
      .catch(e => { overlay(false); if (!e || !e.handled) showGate('通信できませんでした。再読み込みしてください。'); });
  }).catch(function(){
    document.querySelector('.wrap').insertAdjacentHTML('beforeend', '<div class="msg err">読み込めませんでした。時間をおいて再読み込みしてください。</div>');
  });
</script>
</body>
</html>
